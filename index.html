<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Check - Cek Cuaca Instan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4A90E2;
            --secondary-color: #50E3C2;
            --bg-color: #E6F3FF;
            --card-bg: #FFFFFF;
            --text-dark: #333333;
            --text-light: #666666;
            --error-color: #FF6B6B;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow-x: hidden;
            transition: background-color 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .weather-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 360px;
            max-width: 100%;
            animation: fadeIn 0.8s ease-out;
            border: 1px solid #e0e0e0;
        }

        h2 {
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 12px 15px;
            border: 2px solid #e0eeef;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(74, 144, 226, 0.2);
            outline: none;
        }

        button {
            padding: 12px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: background-color 0.3s, transform 0.1s;
            white-space: nowrap;
        }

        button:hover {
            background-color: #3B7ADF;
        }

        button:active {
            transform: scale(0.98);
        }

        .weather-info {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed #e0e0e0;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.4s ease-out, transform 0.4s ease-out;
        }

        .weather-info.show {
            opacity: 1;
            transform: scale(1);
        }

        .city {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 5px;
        }

        .temperature {
            font-size: 54px;
            font-weight: 300;
            color: var(--secondary-color);
            margin: 5px 0;
            letter-spacing: -2px;
        }

        .description {
            font-size: 16px;
            color: var(--text-light);
            text-transform: capitalize;
            margin-bottom: 15px;
        }
        
        .icon-large {
            width: 100px;
            height: 100px;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 5px;
            background: #F8F8F8;
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-dark);
        }

        .detail-value {
            font-weight: 600;
            color: var(--primary-color);
            margin-top: 4px;
        }

        @media (max-width: 400px) {
            .input-group {
                flex-direction: column;
            }
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="weather-container">
        <h2>Cek Cuaca Instan 🌐</h2>
        <div class="input-group">
            <input type="text" id="city-input" placeholder="Nama kota (mis: Jakarta)" onkeydown="if(event.key === 'Enter') getWeather()">
            <button onclick="getWeather()">Cari</button>
        </div>

        <div class="weather-info show" id="weather-result">
            <p style="color: var(--text-light); margin: 0;">✨ Masukkan nama kota untuk mengecek perkiraan cuaca saat ini.</p>
        </div>
    </div>

    <script>
        const API_KEY = '0c000f436dbbb6d70fbe9bef7984bb54';
        const BASE_URL = 'https://api.openweathermap.org/data/2.5/weather';
        const resultDiv = document.getElementById('weather-result');

        function escapeHTML(str) {
            return str.replace(/[&<>'"']/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function setBackgroundTheme(weatherMain) {
            let bgColor = '#E6F3FF';
            const weather = weatherMain ? weatherMain.toLowerCase() : '';
            
            if (weather.includes('clear')) {
                bgColor = '#87CEEB';
            } else if (weather.includes('cloud')) {
                bgColor = '#B0C4DE';
            } else if (weather.includes('rain') || weather.includes('drizzle')) {
                bgColor = '#778899';
            } else if (weather.includes('thunderstorm')) {
                bgColor = '#4F4F4F';
            } else if (weather.includes('snow')) {
                bgColor = '#F0FFFF';
            }

            document.body.style.backgroundColor = bgColor;
        }

        async function getWeather() {
            const cityInput = document.getElementById('city-input');
            const city = cityInput.value.trim();

            if (!city) {
                resultDiv.innerHTML = '<p style="color: var(--error-color);">❌ Mohon masukkan nama kota!</p>';
                resultDiv.classList.add('show');
                return;
            }

            resultDiv.classList.remove('show');
            resultDiv.innerHTML = `<p style="color: var(--primary-color);">🔍 Mencari data cuaca untuk ${escapeHTML(city)}...</p>`;
            resultDiv.classList.add('show');

            const url = `${BASE_URL}?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric&lang=id`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (response.ok) {
                    displayWeather(data);
                    if (data.weather && data.weather[0]) {
                        setBackgroundTheme(data.weather[0].main);
                    }
                } else {
                    const errorMsg = data.message ? data.message.toUpperCase() : 'Kota tidak ditemukan.';
                    resultDiv.innerHTML = `<p style="color: var(--error-color);">❌ Error: ${escapeHTML(errorMsg)}</p>`;
                    document.body.style.backgroundColor = 'var(--bg-color)';
                }
            } catch (error) {
                console.error('Fetch error:', error);
                resultDiv.innerHTML = '<p style="color: var(--error-color);">❌ Terjadi kesalahan koneksi. Pastikan koneksi internet stabil.</p>';
                document.body.style.backgroundColor = 'var(--bg-color)';
            }
        }

        function displayWeather(data) {
            const city = escapeHTML(data.name || '');
            const country = data.sys && data.sys.country ? `, ${escapeHTML(data.sys.country)}` : '';
            const temp = Math.round(data.main.temp);
            const description = data.weather && data.weather[0] ? escapeHTML(data.weather[0].description) : '-';
            const iconCode = data.weather && data.weather[0] ? data.weather[0].icon : '01d';
            const iconUrl = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;
            const windSpeed = data.wind ? data.wind.speed : '-';
            const humidity = data.main ? data.main.humidity : '-';
            const pressure = data.main ? data.main.pressure : '-';
            const feelsLike = data.main ? Math.round(data.main.feels_like) : '-';

            resultDiv.innerHTML = `
                <div class="city">${city}${country}</div>
                <img src="${iconUrl}" alt="${description}" class="icon-large">
                <div class="temperature">${temp}°C</div>
                <div class="description">${description}</div>
                
                <div class="weather-details">
                    <div class="detail-item">
                        Terasa Seperti
                        <span class="detail-value">${feelsLike}°C</span>
                    </div>
                    <div class="detail-item">
                        Kecepatan Angin
                        <span class="detail-value">${windSpeed} m/s</span>
                    </div>
                    <div class="detail-item">
                        Kelembapan
                        <span class="detail-value">${humidity}%</span>
                    </div>
                    <div class="detail-item">
                        Tekanan Udara
                        <span class="detail-value">${pressure} hPa</span>
                    </div>
                </div>
            `;
            resultDiv.classList.add('show');
        }
    </script>
</body>
</html>
